name: Radar FUT Pro 24-7

on:
  schedule:
    # 1. ALERTA DE EVOS Y HYPE: 11:00 hs de Argentina (14:00 UTC)
    - cron: '0 14 * * *'
    # 2. REPORTES DE MERCADO: 15:05 hs, 19:00 hs y 23:00 hs de Argentina
    - cron: '5 18 * * *'
    - cron: '0 22 * * *'
    - cron: '0 2 * * *'
    # 3. MANTENER VIVO EL BOT CADA 30 MIN (Con turnos de 55 min para cero espera)
    - cron: '*/30 * * * *'

  workflow_dispatch:
    inputs:
      modo_manual:
        description: '¿Qué querés iniciar ahora en la nube?'
        required: true
        default: '--cloud-live'
        type: choice
        options:
          - '--cloud-live'
          - '--auto'
          - '--evo'

permissions:
  contents: write

# Si arranca un turno nuevo, guarda y cierra limpiamente el anterior sin solaparse
concurrency:
  group: bot-telegram-vivo
  cancel-in-progress: false

jobs:
  operar-mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar codigo y agenda
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar libreria de conexion
        run: pip install requests

      - name: Ejecutar Alertas Programadas segun la hora de Argentina
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.modo_manual }}" != "--cloud-live" ]; then
            python bot_fut.py ${{ github.event.inputs.modo_manual }}
          elif [ "${{ github.event.schedule }}" = "0 14 * * *" ]; then
            python bot_fut.py --evo
          elif [ "${{ github.event.schedule }}" = "5 18 * * *" ] || [ "${{ github.event.schedule }}" = "0 22 * * *" ] || [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then
            python bot_fut.py --auto
          fi

      - name: Escuchar tus comandos y seguimientos en vivo (55 min continuos)
        run: python bot_fut.py --cloud-live

      - name: Guardar cambios en tu Agenda Contable en la nube
        if: always()
        run: |
          git config --global user.name "FUT Bot"
          git config --global user.email "bot@github.com"
          git add mi_agenda_fut.json
          git diff --staged --quiet || (git commit -m "Actualizacion automatica de agenda" && git push --rebase origin main || git push)
